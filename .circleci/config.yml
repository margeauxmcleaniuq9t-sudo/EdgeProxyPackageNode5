            mkdir -p /tmp/ExecuteKernelSanityTests
            { set +o pipefail 2>/dev/null; unit="allocator"; echo "$unit is ready"; true ; } > /tmp/ExecuteKernelSanityTests/check-out-file-server-scripts
      - persist_to_workspace:
          root: /tmp/ExecuteKernelSanityTests
          paths:
            - 'check-out-file-server-scripts'
